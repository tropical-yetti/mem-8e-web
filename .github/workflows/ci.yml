# Verificações em cada pull request e em cada push na main.
# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cobertura
      - name: Verificar licenças das dependências
        run: npm run licencas
      - run: npm run build

      # Prévia: o site inteiro num único index.html, para abrir no navegador
      # sem servidor. Fica nos "Artifacts" da execução, em cada pull request.
      - run: npm run build:previa
      - uses: actions/upload-artifact@v4
        with:
          name: previa-mem-8e-web
          path: dist-previa/index.html
          retention-days: 14

  # Roda dentro da imagem oficial do Playwright, que já traz os navegadores e
  # as bibliotecas de sistema: nada de baixar ~180 pacotes a cada execução.
  # A versão da imagem precisa ser a mesma do @playwright/test no
  # package.json (tests/ci.test.ts confere).
  ponta-a-ponta:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse (desempenho, acessibilidade, boas práticas)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Resumo das notas (aparece nas anotações da execução)
        if: always()
        run: |
          node -e '
            const m = require("./.lighthouseci/manifest.json").filter(r => r.isRepresentativeRun)
            for (const r of m) {
              const notas = Object.entries(r.summary).map(([k, v]) => `${k}=${Math.round(v * 100)}`).join(" ")
              console.log(`::notice title=Lighthouse ${r.url.replace(/^.*mem-8e-web/, "")}::${notas}`)
            }'
